name: Executor migration CI

on:
  push:
    branches:
      - 'chore/polymarket-client-migration-20260909'
    paths:
      - 'executor/**'
      - '.github/workflows/executor-migration-ci.yml'
  pull_request:
    paths:
      - 'executor/**'
      - '.github/workflows/executor-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chore/polymarket-client-migration-20260909'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install migration dependencies and refresh lockfile in runner
        working-directory: executor
        run: npm install --ignore-scripts

      - name: Unit tests
        working-directory: executor
        run: npm test

      - name: Typecheck
        working-directory: executor
        run: npm run typecheck

      - name: Dry-run builder attribution
        working-directory: executor
        run: npm run dry-run

      - name: Upload refreshed executor lockfile
        uses: actions/upload-artifact@v4
        with:
          name: executor-package-lock
          path: executor/package-lock.json
          if-no-files-found: error

      - name: Commit refreshed executor lockfile
        run: |
          if git diff --quiet -- executor/package-lock.json; then
            echo "executor/package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executor/package-lock.json
          git commit -m "chore(executor): refresh package lock"
          git push origin HEAD:chore/polymarket-client-migration-20260909
